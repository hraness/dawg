# Weekly dependency update proposals. Every update arrives as a pull request
# that auto-merges once the required checks pass (minor and patch only)
# (workflows/dependabot-auto-merge.yml); this file grants no release authority.
version: 2
updates:
  # bun.lock is the lockfile and the npm ecosystem cannot update it; the bun
  # ecosystem updates package.json and bun.lock together.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      bun-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: bun
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      bun-site-minor-and-patch:
        update-types: [minor, patch]
    # Held until the lint stack supports them: typescript-eslint rejects
    # TypeScript 7 ("does not support TS 7.0"), and eslint-plugin-react, via
    # eslint-config-next, calls context.getFilename, which ESLint 10 removed.
    # Remove an entry once eslint-config-next supports that major.
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
      - dependency-name: eslint
        versions: [">=10"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

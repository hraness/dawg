name: Native sink

# Builds the native audio sink (native/sink, Rust + cpal) for every shipped
# platform, runs its unit tests and the headless null-device smoke test, and
# uploads one artifact per platform. Check runs it on every pull request;
# the release workflow runs it again and packs the four libraries into the
# release tarball. Nothing is ever compiled on a user's machine.

on:
  workflow_call:
    inputs:
      retention-days:
        type: number
        default: 7

permissions:
  contents: read

jobs:
  build:
    name: sink ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            file: libdawg_sink.dylib
            test: true
          - platform: darwin-x64
            runner: macos-15
            target: x86_64-apple-darwin
            file: libdawg_sink.dylib
            test: false
          # Ubuntu 22.04 keeps the glibc floor at 2.35.
          - platform: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            file: libdawg_sink.so
            test: true
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            file: libdawg_sink.so
            test: true
    defaults:
      run:
        working-directory: native/sink
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target "${{ matrix.target }}"
          rustup default 1.97.1
          rustc --version
      - name: Unit tests (ring, null device)
        if: matrix.test
        run: cargo test --locked --release --target "${{ matrix.target }}"
      - name: Build
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Stage
        run: |
          dest="../prebuilt/${{ matrix.platform }}"
          mkdir -p "${dest}"
          cp "target/${{ matrix.target }}/release/${{ matrix.file }}" "${dest}/"
          ls -l "${dest}"
      - name: Headless smoke test through bun:ffi
        if: matrix.test
        working-directory: .
        run: bun native/smoke.ts "native/prebuilt/${{ matrix.platform }}/${{ matrix.file }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sink-${{ matrix.platform }}
          path: native/prebuilt/${{ matrix.platform }}/${{ matrix.file }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

name: Tag release

# When Check passes on a main commit whose package.json version has no
# v<version> tag yet, this creates that annotated tag, which starts the
# tag-triggered release workflow. Keying on the missing tag, not on a version
# change in the last commit, means a version bump whose own Check failed is
# still tagged by the next green commit on main. The tag comes from the
# hraness-release-tagger GitHub App because tags pushed with GITHUB_TOKEN do
# not trigger workflows.

on:
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: auto-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag version bump
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Detect untagged version
        id: version
        run: |
          set -euo pipefail
          read_version() { node -e 'const v = JSON.parse(require("fs").readFileSync(0, "utf8")).version; if (typeof v === "string") process.stdout.write(v)'; }
          version="$(read_version < package.json)"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version $version is not a stable release; nothing to tag."
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version already exists; nothing to tag."
            exit 0
          fi
          # Only a version newer than every release counts, so re-running Check
          # on an old commit (for example one at the never-tagged 0.1.0) does
          # not release it.
          latest="$(git tag -l 'v*' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -n 1 || true)"
          if [[ -n "$latest" && "$(printf '%s\n%s\n' "$latest" "v$version" | sort -V | tail -n 1)" != "v$version" ]]; then
            echo "v$version is older than the latest release $latest; nothing to tag."
            exit 0
          fi
          echo "v$version is newer than ${latest:-every release} and has no tag yet; tagging this green commit."
          printf 'tag=v%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Mint tagger token
        if: steps.version.outputs.tag
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_TAGGER_APP_ID }}
          private-key: ${{ secrets.RELEASE_TAGGER_PRIVATE_KEY }}
          permission-contents: write
      - name: Create annotated tag
        if: steps.version.outputs.tag
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; leaving it unchanged."
            exit 0
          fi
          object="$(gh api "repos/$REPO/git/tags" -f tag="$TAG" -f message="${REPO#*/} ${TAG#v}" -f object="$SHA" -f type=commit -q .sha)"
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$object" >/dev/null
          echo "Created $TAG at $SHA"

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Check tag matches package.json version
        id: version
        run: |
          version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          tag="${GITHUB_REF_NAME}"
          if [ "${tag}" != "v${version}" ]; then
            echo "::error::tag ${tag} does not match package.json version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - run: bun install --frozen-lockfile
      - run: bun run check

      - name: Pack tarball and checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          bun pm pack --destination dist
          cd dist
          test -f "hraness-dawg-${VERSION}.tgz"
          sha256sum "hraness-dawg-${VERSION}.tgz" > SHA256SUMS
          cat SHA256SUMS

      - name: Smoke-test the packed install
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prefix="$(mktemp -d)"
          BUN_INSTALL="${prefix}" bun add -g "${PWD}/dist/hraness-dawg-${VERSION}.tgz"
          "${prefix}/bin/dawg" --help

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v version="${VERSION}" '
            $0 ~ "^## \\[?" version "\\]?( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > dist/NOTES.md
          if ! grep -q '[^[:space:]]' dist/NOTES.md; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}"
            exit 1
          fi

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hraness-dawg-${{ steps.version.outputs.version }}.tgz

      # Assets are attached to a draft first, then the release is published in
      # one step so it becomes immutable with both assets in place.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/hraness-dawg-${VERSION}.tgz" \
            dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file dist/NOTES.md \
            --verify-tag \
            --draft
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isImmutable,assets

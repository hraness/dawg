name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check

  sink:
    uses: ./.github/workflows/sink.yml

  # The release packaging path on every pull request: stage the four sink
  # libraries, write the manifest, pack, install, and require the installed
  # package to verify and load its linux-x64 sink.
  package:
    needs: sink
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sink-*
          path: native/prebuilt
      - run: native/stage-prebuilt.sh native/prebuilt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev
      - run: |
          mkdir dist
          bun pm pack --destination dist --quiet
          tar -tzf dist/*.tgz | grep native/prebuilt
          native/verify-install.sh "$(ls "${PWD}"/dist/*.tgz)"
